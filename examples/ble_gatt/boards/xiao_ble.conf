# Enable QSPI flash driver
CONFIG_NORDIC_QSPI_NOR=y

# Enable flash operations
CONFIG_FLASH=y

# Enable the flash map and partitions
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# Configure MCUboot to use the secondary slot on the external flash
# Note: When using sysbuild, these may need to be set for MCUboot itself as well.
# CONFIG_BOOT_SECONDARY_IN_FLASH_ID=y
# CONFIG_BOOT_FIXED_RESOURCES_DEVICE_ID=y

# LittleFS settings (matching app.overlay)
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
