# Enable QSPI driver in MCUboot
CONFIG_NORDIC_QSPI_NOR=y

# Increase max image sectors for 944KB partitions (944 / 4 = 236 sectors)
CONFIG_BOOT_MAX_IMG_SECTORS=256

# MCUboot must run from address 0x0
CONFIG_FLASH_LOAD_OFFSET=0x0

# Skip signature validation for development (allows unsigned/test-signed images)
CONFIG_BOOT_SIGNATURE_TYPE_NONE=y

# Disable watchdog to prevent resets during boot
CONFIG_BOOT_WATCHDOG_FEED=n

CONFIG_USB_DEVICE_STACK=n
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_BOOT_BANNER=y
CONFIG_MCUBOOT_LOG_LEVEL_DBG=y
